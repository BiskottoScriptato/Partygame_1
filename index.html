<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIVIA CHAOS - Party Game</title>
    <!-- PeerJS per Multiplayer P2P senza server backend -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #121225;
            --card: #1e1e38;
            --accent: #ff2a6d;
            --primary: #05d9e8;
            --text: #ffffff;
            --success: #00ff87;
            --warn: #ffbd03;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        #app { width: 100%; max-width: 450px; background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; }

        h1, h2 { text-align: center; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 20px; }

        input, button, select { width: 100%; padding: 15px; margin: 8px 0; border-radius: 12px; border: none; font-size: 1rem; font-weight: bold; }
        input { background: #2a2a4a; color: #fff; text-align: center; }
        button { background: var(--accent); color: white; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        button:active { transform: scale(0.97); }
        button.secondary { background: var(--primary); color: #000; }

        .hidden { display: none !important; }
        .timer-bar { height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin: 15px 0; }
        .timer-fill { height: 100%; background: var(--accent); width: 100%; transition: width 1s linear; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .opt-btn { background: #2a2a4a; color: white; border: 2px solid #3d3d66; padding: 15px; font-size: 0.9rem; min-height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; }
        .opt-btn.selected { border-color: var(--primary); background: #3b3b66; }

        .inganni-container { background: #151528; border-radius: 12px; padding: 10px; margin-top: 15px; }
        .inganni-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .inganno-card { background: #2a2a4a; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; white-space: nowrap; border: 1px solid var(--accent); cursor: pointer; flex-shrink: 0; }
        
        .player-badge { background: #2a2a4a; padding: 8px; border-radius: 8px; margin: 4px 0; display: flex; justify-content: space-between; font-size: 0.9rem; }
        .leaderboard { margin-top: 15px; }
    </style>
</head>
<body>

<div id="app">
    <!-- LOBBY SCREEN -->
    <div id="screen-lobby">
        <h1>TRIVIA CHAOS</h1>
        <p class="subtitle">Party Game & Inganni Strategy</p>
        
        <input type="text" id="player-name" placeholder="Il tuo Nome" maxlength="12">
        
        <div style="margin-top: 20px;">
            <button onclick="createRoom()">Crea Stanza</button>
            <div style="text-align: center; margin: 10px 0; color: #666;">- oppure -</div>
            <input type="text" id="room-code-input" placeholder="Codice Stanza (4 Lettere)" style="text-transform: uppercase;">
            <button class="secondary" onclick="joinRoom()">Entra in Stanza</button>
        </div>
    </div>

    <!-- ROOM WAITING SCREEN -->
    <div id="screen-waiting" class="hidden">
        <h2>Stanza: <span id="display-room-code" style="color: var(--accent);">----</span></h2>
        <p class="subtitle">In attesa degli altri giocatori...</p>
        <div id="players-list"></div>
        <button id="start-btn" class="hidden" onclick="startGame()" style="margin-top: 20px;">Avvia Partita</button>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="screen-game" class="hidden">
        <div>
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: #aaa;">
                <span>Turno <span id="round-num">1</span>/3</span>
                <span>Punti: <b id="my-score" style="color: var(--success);">300</b></span>
            </div>
            <div class="timer-bar"><div id="timer" class="timer-fill"></div></div>
            <h3 id="question-text" style="text-align: center; min-height: 60px;">Caricamento domanda...</h3>
        </div>

        <div class="options-grid">
            <button class="opt-btn" onclick="selectAnswer(0)" id="opt-0">A</button>
            <button class="opt-btn" onclick="selectAnswer(1)" id="opt-1">B</button>
            <button class="opt-btn" onclick="selectAnswer(2)" id="opt-2">C</button>
            <button class="opt-btn" onclick="selectAnswer(3)" id="opt-3">D</button>
        </div>

        <!-- INGANNI SELECTION -->
        <div class="inganni-container">
            <span style="font-size: 0.75rem; color: #aaa;">Lancia un Inganno (Prima di rispondere):</span>
            <div class="inganni-list">
                <div class="inganno-card" onclick="castInganno('Silenzia', 120)">🚫 Silenzia (120pt)</div>
                <div class="inganno-card" onclick="castInganno('Sotto Sopra', 150)">🔄 Sotto Sopra (150pt)</div>
                <div class="inganno-card" onclick="castInganno('Scudo', 100)">🛡️ Scudo (100pt)</div>
            </div>
            <select id="target-player" style="padding: 5px; font-size: 0.8rem; margin-top: 5px;">
                <option value="">Seleziona Bersaglio...</option>
            </select>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-results" class="hidden">
        <h2>Risultati Turno</h2>
        <div class="leaderboard" id="leaderboard"></div>
        <button onclick="nextRound()" id="next-btn" class="hidden" style="margin-top: 20px;">Prossimo Turno</button>
    </div>
</div>

<script>
    // CORE GAME DATA & STATE
    let peer = null;
    let connections = [];
    let hostConn = null;
    let isHost = false;
    let roomCode = '';
    let myName = '';
    let myScore = 300;
    let selectedAnswer = null;
    let usedInganno = null;
    let targetPlayerId = null;
    let timerInterval = null;

    // Configurazione WebRTC con STUN Server ufficiali Google
    const peerConfig = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        }
    };

    const questions = [
        { q: "Qual è la capitale della Spagna?", a: ["Barcellona", "Madrid", "Siviglia", "Valencia"], correct: 1 },
        { q: "Quanti pianeti ci sono nel Sistema Solare?", a: ["7", "8", "9", "10"], correct: 1 },
        { q: "Chi ha dipinto la Gioconda?", a: ["Michelangelo", "Raffaello", "Leonardo da Vinci", "Donatello"], correct: 2 }
    ];
    let currentRound = 0;
    let players = [];

    function createRoom() {
        myName = document.getElementById('player-name').value.trim() || 'Host';
        roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        isHost = true;

        peer = new Peer('TRIVIA-' + roomCode, peerConfig);

        peer.on('open', (id) => {
            showScreen('screen-waiting');
            document.getElementById('display-room-code').innerText = roomCode;
            document.getElementById('start-btn').classList.remove('hidden');
            players.push({ id: peer.id, name: myName, score: 300, answer: null, inganno: null, target: null });
            updatePlayersList();
        });

        peer.on('connection', (conn) => {
            conn.on('open', () => {
                let existingConnIndex = connections.findIndex(c => c.peer === conn.peer);
                if (existingConnIndex !== -1) {
                    connections[existingConnIndex] = conn;
                } else {
                    connections.push(conn);
                }
            });

            conn.on('data', (data) => handleHostMessage(data, conn));
        });

        peer.on('error', (err) => {
            alert("Errore creazione stanza: " + err.type);
        });
    }

    function joinRoom() {
        myName = document.getElementById('player-name').value.trim() || 'Giocatore';
        roomCode = document.getElementById('room-code-input').value.trim().toUpperCase();

        if (!roomCode) {
            alert("Inserisci il codice stanza!");
            return;
        }

        peer = new Peer(peerConfig);

        peer.on('open', (id) => {
            hostConn = peer.connect('TRIVIA-' + roomCode, { reliable: true });

            hostConn.on('open', () => {
                hostConn.send({ type: 'JOIN', name: myName, id: peer.id });
                showScreen('screen-waiting');
                document.getElementById('display-room-code').innerText = roomCode;
            });

            hostConn.on('data', (data) => handleClientMessage(data));

            setTimeout(() => {
                if (!hostConn || !hostConn.open) {
                    alert("Impossibile connettersi alla stanza. Verifica che l'Host sia online!");
                }
            }, 6000);
        });

        peer.on('error', (err) => {
            alert("Errore connessione: " + err.type);
        });
    }

    // MESSAGE HANDLING (HOST)
    function handleHostMessage(data, conn) {
        if (data.type === 'JOIN') {
            let existingPlayer = players.find(p => p.id === data.id);
            if (!existingPlayer) {
                players.push({ id: data.id, name: data.name, score: 300, answer: null, inganno: null, target: null });
            } else {
                existingPlayer.name = data.name;
            }
            broadcast({ type: 'PLAYER_LIST', players: players });
            updatePlayersList();
        }
        if (data.type === 'SUBMIT_ACTION') {
            let p = players.find(x => x.id === data.id);
            if (p) {
                p.answer = data.answer;
                p.inganno = data.inganno;
                p.target = data.target;
            }
        }
    }

    // MESSAGE HANDLING (CLIENT)
    function handleClientMessage(data) {
        if (data.type === 'PLAYER_LIST') {
            players = data.players;
            updatePlayersList();
        }
        if (data.type === 'START_ROUND') {
            startRoundClient(data.round, data.question);
        }
        if (data.type === 'ROUND_RESULTS') {
            showResults(data.players);
        }
    }

    function broadcast(data) {
        connections.forEach(c => {
            try {
                if (c && c.open) c.send(data);
            } catch (e) {
                console.error("Errore invio broadcast: ", e);
            }
        });
    }

    function showScreen(id) {
        document.querySelectorAll('#app > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function updatePlayersList() {
        const list = document.getElementById('players-list');
        const targetSelect = document.getElementById('target-player');
        list.innerHTML = '';
        targetSelect.innerHTML = '<option value="">Seleziona Bersaglio...</option>';

        players.forEach(p => {
            list.innerHTML += `<div class="player-badge"><span>${p.name}</span><b>${p.score} pt</b></div>`;
            if (p.id !== peer.id) {
                targetSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            }
        });
    }

    function startGame() {
        if (!isHost) return;
        currentRound = 0;
        sendNextQuestion();
    }

    function sendNextQuestion() {
        let q = questions[currentRound];
        players.forEach(p => { p.answer = null; p.inganno = null; p.target = null; });
        broadcast({ type: 'START_ROUND', round: currentRound + 1, question: q });
        startRoundClient(currentRound + 1, q);
    }

    function startRoundClient(roundNum, question) {
        showScreen('screen-game');
        document.getElementById('round-num').innerText = roundNum;
        document.getElementById('question-text').innerText = question.q;
        
        selectedAnswer = null;
        usedInganno = null;

        for (let i = 0; i < 4; i++) {
            let btn = document.getElementById(`opt-${i}`);
            btn.innerText = question.a[i];
            btn.classList.remove('selected');
        }

        let timerFill = document.getElementById('timer');
        timerFill.style.width = '100%';
        let timeLeft = 15;

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            timerFill.style.width = (timeLeft / 15 * 100) + '%';
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitTurnAction();
                if (isHost) setTimeout(resolveTurn, 1000);
            }
        }, 1000);
    }

    function selectAnswer(index) {
        selectedAnswer = index;
        for (let i = 0; i < 4; i++) {
            document.getElementById(`opt-${i}`).classList.toggle('selected', i === index);
        }
    }

    function castInganno(name, cost) {
        let target = document.getElementById('target-player').value;
        if (!target) { alert('Seleziona un bersaglio dal menu!'); return; }
        if (myScore < cost) { alert('Punti insufficienti!'); return; }

        myScore -= cost;
        document.getElementById('my-score').innerText = myScore;
        usedInganno = { name: name, cost: cost };
        targetPlayerId = target;
        alert(`Inganno ${name} lanciato!`);
    }

    function submitTurnAction() {
        let payload = {
            type: 'SUBMIT_ACTION',
            id: peer.id,
            answer: selectedAnswer,
            inganno: usedInganno,
            target: targetPlayerId
        };

        if (isHost) {
            handleHostMessage(payload, null);
        } else if (hostConn && hostConn.open) {
            hostConn.send(payload);
        }
    }

    function resolveTurn() {
        let q = questions[currentRound];

        players.forEach(p => {
            let isShielded = players.some(x => x.target === p.id && x.inganno?.name === 'Scudo');
            let isSilenced = players.some(x => x.target === p.id && x.inganno?.name === 'Silenzia') && !isShielded;
            let isFlipped = players.some(x => x.target === p.id && x.inganno?.name === 'Sotto Sopra') && !isShielded;

            if (isSilenced) return;

            let correct = p.answer === q.correct;
            if (isFlipped) correct = !correct;

            if (correct) {
                p.score += 200;
            } else if (p.answer !== null) {
                p.score -= 100;
            }
        });

        broadcast({ type: 'ROUND_RESULTS', players: players });
        showResults(players);
    }

    function showResults(updatedPlayers) {
        showScreen('screen-results');
        const lb = document.getElementById('leaderboard');
        lb.innerHTML = '';
        
        updatedPlayers.sort((a,b) => b.score - a.score).forEach((p, idx) => {
            lb.innerHTML += `<div class="player-badge"><span>#${idx+1} ${p.name}</span><b>${p.score} pt</b></div>`;
        });

        if (isHost) {
            let nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
        }
    }

    function nextRound() {
        currentRound++;
        if (currentRound < questions.length) {
            sendNextQuestion();
        } else {
            alert('Partita completata!');
        }
    }
</script>
</body>
</html>
